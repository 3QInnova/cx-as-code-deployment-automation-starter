name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Compile source
        run: python -m compileall -q cxdeploy tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Exercise promotion CLI
        run: |
          cxdeploy plan \
            --source examples/dev.json \
            --target examples/prod.json \
            --select flow:customer-service \
            --out build/promotion-plan.json
          cxdeploy export-manifest \
            --source examples/dev.json \
            --select flow:customer-service \
            --out build/terraform-manifest.json

