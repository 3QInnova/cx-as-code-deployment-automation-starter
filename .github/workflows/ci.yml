name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Compile source
        run: python -m compileall -q cxdeploy tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Exercise promotion CLI
        run: |
          cxdeploy plan \
            --source examples/dev.json \
            --target examples/prod.json \
            --select flow:customer-service \
            --out build/promotion-plan.json
          cxdeploy export-manifest \
            --source examples/dev.json \
            --select flow:customer-service \
            --out build/terraform-manifest.json
